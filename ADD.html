                        </p>
                        <h5 style="margin-top: 20px; color: #fff;">Example 1:</h5>
                        <pre style="background: #000; padding: 10px; border-radius: 4px; margin-top: 5px; color: var(--text-muted); font-size: 0.85rem;">Input: nums = [2,7,11,15], target = 9\nOutput: [0,1]</pre>
                    </div>
                    <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                        <h4 style="margin-bottom: 10px;">Code Editor (JavaScript)</h4>
                        <textarea id="code-editor" class="lux-input" style="flex-grow: 1; font-family: monospace; line-height: 1.5; resize: none;">function twoSum(nums, target) {\n    // Write your code here\n    \n}</textarea>
                        <div class="flex gap-10" style="margin-top: 15px;">
                            <button class="btn" style="flex: 1;" onclick="showToast('Running test cases...', 'info')">Run Code</button>
                            <button class="btn btn-filled" style="flex: 1;" onclick="showToast('Solution Submitted! All tests passed.', 'success')">Submit</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- INTERACTION LOGIC ---

        let currentJobIdForApp = null;

        function openApplicationModal(jobId) {
            const job = state.jobs.find(j => j.id === jobId);
            
            // Check if already applied
            const exists = state.applications.find(a => a.jobId === jobId && a.studentName === state.currentUser.name);
            if(exists) {
                showToast("You have already applied to this position.", "error");
                return;
            }

            currentJobIdForApp = jobId;
            document.getElementById('modal-job-title').innerText = job.title;
            document.getElementById('modal-company').innerText = job.company;
            document.getElementById('app-name').value = state.currentUser.name;
            
            document.getElementById('application-modal').classList.remove('hidden');
        }

        function viewApplication(appId) {
            const app = state.applications.find(a => a.id === appId);
            if (!app) return;
            const job = state.jobs.find(j => j.id === app.jobId) || { title: 'Unknown', company: 'Unknown' };

            document.getElementById('modal-job-title').innerText = job.title;
            document.getElementById('modal-company').innerText = job.company;
            
            document.getElementById('app-name').value = app.studentName;
            document.getElementById('app-email').value = "student@example.com"; 
            document.getElementById('app-cover').value = "Application submitted on " + app.date + ".";
            
            // Set View Mode
            document.getElementById('app-email').readOnly = true;
            document.getElementById('app-cover').readOnly = true;
            document.querySelector('#application-modal h3').innerText = "Application Details";
            document.querySelector('#application-form button[type=\"submit\"]').classList.add('hidden');
            document.querySelector('#application-form button.btn-danger').innerText = "Close";

            document.getElementById('application-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('application-modal').classList.add('hidden');
            document.getElementById('application-form').reset();
            currentJobIdForApp = null;

            // Revert View Mode
            document.getElementById('app-email').readOnly = false;
            document.getElementById('app-cover').readOnly = false;
            document.querySelector('#application-modal h3').innerText = "Apply for Position";
            document.querySelector('#application-form button[type=\"submit\"]').classList.remove('hidden');
            document.querySelector('#application-form button.btn-danger').innerText = "Cancel";
        }

        function openStudentProfileModal(candidateId) {
            const candidate = state.candidates.find(c => c.id === candidateId);
            if (!candidate) {
                showToast("Candidate not found.", "error");
                return;
            }

            const modal = document.getElementById('student-profile-modal');
            const content = document.getElementById('student-profile-content');

            content.innerHTML = `
                <div class="flex items-center gap-20" style="border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 20px;">
                    <img src="https://picsum.photos/seed/${candidate.name.replace(/ /g, '')}/100/100" alt="User" class="avatar" style="width: 80px; height: 80px;">
                    <div>
                        <h3 style="margin-bottom: 5px;">${candidate.name}</h3>
                        <p style="color: var(--gold-primary);">${candidate.branch}</p>
                    </div>
                </div>
                <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <div class="stat-card">
                        <div class="stat-number">${candidate.cgpa}</div>
                        <p>CGPA</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${candidate.skills.split(',').length}</div>
                        <p>Key Skills</p>
                    </div>
                </div>
                <div class="card">
                    <h4><i class="fa-solid fa-star" style="margin-right:10px;"></i> Key Skills</h4>
                    <div style="margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px;">
                        ${candidate.skills.split(',').map(skill => `<span class="badge badge-pending">${skill.trim()}</span>`).join('')}
                    </div>
                </div>
                <div class="card">
                     <h4><i class="fa-solid fa-file-lines" style="margin-right:10px;"></i> Resume</h4>
                     <p style="color: var(--text-muted); margin-top: 10px;">The candidate's resume is available for download.</p>
                     <button class="btn btn-filled" style="margin-top: 15px;" onclick="showToast('Downloading resume for ${candidate.name}...', 'info')">Download Resume (PDF)</button>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeStudentProfileModal() {
            document.getElementById('student-profile-modal').classList.add('hidden');
        }

        async function submitApplication(event) {
            event.preventDefault();
            
            if (!currentJobIdForApp) return;

            const job = state.jobs.find(j => j.id === currentJobIdForApp);
            
            const newApp = {
                id: Date.now(),
                jobId: currentJobIdForApp,
                studentName: state.currentUser.name,
                role: "Student",
                status: "Pending",
                date: new Date().toISOString().split('T')[0]
            };

            state.applications.push(newApp);
            await saveState();
            showToast(`Application sent to ${job.company}`, "success");
            closeModal();
        }

        async function handleProfileUpdate() {
            const branch = document.getElementById('profBranch').value;
            const year = document.getElementById('profYear').value;
            const cgpa = document.getElementById('profCGPA').value;
            const resumeInput = document.getElementById('profResume');
            
            if (!branch || !year || !cgpa) {
                showToast("Please fill in all academic details", "error");
                return;
            }

            let resumeName = state.studentProfile.resume;
            if (resumeInput.files.length > 0) {
                resumeName = resumeInput.files[0].name;
            }

            state.studentProfile = { branch, year, cgpa, resume: resumeName };
            await saveState();

            showToast("Profile updated successfully", "success");
            // Refresh view to show saved state
            loadContent('profile');
        }

        async function handlePostJob() {
            const title = document.getElementById('jobTitle').value;
            const company = document.getElementById('jobCompany').value;
            const salary = document.getElementById('jobSalary').value;
            const type = document.getElementById('jobType').value;

            if(!title || !company) {
                showToast("Please fill in required fields", "error");
                return;
            }

            const newJob = {
                id: Date.now(),
                title, company, salary, type, 
                posted: new Date().toISOString().split('T')[0],
                status: "Active"
            };

            state.jobs.unshift(newJob); // Add to top
            await saveState();
            showToast("Job Posted Successfully", "success");
            
            // If role is company, go back to jobs list, if admin refresh list
            // For simplicity, we just reload the Post Job form clear, or nav back
            document.getElementById('post-job-form').reset();
        }

        async function updateAppStatus(appId, newStatus) {
            const appIndex = state.applications.findIndex(a => a.id === appId);
            if (appIndex !== -1) {
                
                state.applications[appIndex].status = newStatus;
                await saveState();
                showToast(`Application marked as ${newStatus}`, newStatus === 'Accepted' ? 'success' : 'info');
                // Re-render current view
                loadContent('manage-apps');
            }
        }

        // --- NOTIFICATION FUNCTIONS ---
        function updateNotificationBadge() {
            const badge = document.getElementById('notification-badge');
            const unreadCount = state.notifications.filter(n => !n.read).length;

            if (unreadCount > 0) {
                badge.innerText = unreadCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function toggleNotifications() {
            const panel = document.getElementById('notification-panel');
            const isOpen = !panel.classList.contains('hidden');
            
            if (isOpen) {
                panel.classList.add('hidden');
            } else {
                renderNotifications();
                panel.classList.remove('hidden');
            }
        }

        function renderNotifications() {
            const panel = document.getElementById('notification-panel');
            const unreadCount = state.notifications.filter(n => !n.read).length;

            const itemsHTML = state.notifications.map(n => `
                <div class="notification-item ${n.read ? '' : 'unread'}" onclick="handleNotificationClick(${n.id})">
                    <div class="notification-icon">
                        <i class="fa-solid ${n.icon}" style="color: ${n.color};"></i>
                    </div>
                    <div class="notification-text">${n.text}</div>
                </div>
            `).join('');

            panel.innerHTML = `
                <div class="notification-header">
                    <h4 style="color: #fff;">Notifications (${unreadCount})</h4>
                    <a href="#" style="font-size: 0.8rem; color: var(--gold-primary);" onclick="event.preventDefault(); markAllAsRead()">Mark all as read</a>
                </div>
                <div class="notification-list">${itemsHTML.length ? itemsHTML : '<p style="color: var(--text-muted); text-align: center; padding: 20px;">No notifications.</p>'}</div>
                <div class="notification-footer">
                    <a href="#" style="font-size: 0.8rem; color: var(--text-muted);">View all notifications</a>
                </div>
            `;
        }

        async function markAllAsRead() {
            state.notifications.forEach(n => n.read = true);
            renderNotifications();
            await saveState();
            updateNotificationBadge();
            showToast("All notifications marked as read.", "info");
        }

        // --- UTILS ---

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            let icon = 'fa-info-circle';
            let color = 'var(--gold-primary)';
            
            if (type === 'success') { icon = 'fa-check-circle'; color = '#4caf50'; }
            if (type === 'error') { icon = 'fa-exclamation-circle'; color = '#ef5350'; }

            toast.style.borderLeftColor = color;
            toast.innerHTML = `
                <span>${message}</span>
                <i class="fa-solid ${icon}" style="color: ${color};"></i>
            `;
            container.appendChild(toast);
            // Remove after specified duration
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }
        async function handleNotificationClick(id) {
            const notification = state.notifications.find(n => n.id === id);
            if (notification) {
                notification.read = true;
                
                if (notification.link) {
                    const navItem = document.getElementById(`nav-item-${notification.link}`);
                    if (navItem) {
                        switchTab(notification.link, navItem);
                    }
                }
                await saveState();
                toggleNotifications(); // Close panel after click
                updateNotificationBadge();
            }
        }
        // --- AI WIDGET LOGIC ---
        function toggleAiChat() {
            const chatWindow = document.getElementById('ai-chat-window');
            chatWindow.classList.toggle('hidden');
        }
        function handleAiInput(event) {
            if (event.key === 'Enter') sendAiMessage();
        }
        function sendAiMessage() {
            const input = document.getElementById('ai-user-input');
            const msg = input.value.trim();
            if (!msg) return;
            // Add User Message
            addAiMessage(msg, 'user');
            input.value = '';
            // Simulate AI Response
            setTimeout(() => {
                const response = getAiResponse(msg);
                addAiMessage(response, 'bot');
            }, 1000);
        }
        function addAiMessage(text, sender) {
            const container = document.getElementById('ai-messages');
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'ai-msg-user' : 'ai-msg-bot';
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        function getAiResponse(msg) {
            msg = msg.toLowerCase();
            if (msg.includes('hello') || msg.includes('hi')) return "Hello! How can I help you with your career journey today?";
            if (msg.includes('job') || msg.includes('opening')) return "You can view available jobs in the 'Available Jobs' section of your dashboard.";
            if (msg.includes('resume') || msg.includes('cv')) return "Need help with your resume? Check out the Interview Prep Hub for guides and templates.";
            if (msg.includes('interview')) return "You can schedule or practice interviews in the Interview Prep Hub.";
            if (msg.includes('status')) return "You can check your application status in 'My Applications'.";
            return "I'm here to help! You can ask me about jobs, interviews, or your profile.";
        }
    </script>
</body>

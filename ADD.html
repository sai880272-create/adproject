<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB MATCH | Management System</title>
    
    <!-- Google Fonts for Luxury Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jsPDF and html2canvas for Resume Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            /* Luxury Palette */
            --bg-dark: #050505;
            --bg-panel: #121212;
            --bg-panel-lighter: #1e1e1e;
            
            --gold-primary: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-dim: #8a7126;
            
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            
            --danger: #8b0000;
            --success: #1b5e20;
            --info: #0d47a1;

            --shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            --gold-glow: 0 0 10px rgba(212, 175, 55, 0.3);
            
            --font-heading: 'Cinzel', serif;
            --font-body: 'Lato', sans-serif;
            
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- TYPOGRAPHY --- */
        h1, h2, h3, h4 {
            font-family: var(--font-heading);
            color: var(--gold-primary);
            letter-spacing: 1px;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }
        
        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-10 { gap: 10px; }
        .gap-20 { gap: 20px; }
        
        .btn {
            padding: 10px 20px;
            border: 1px solid var(--gold-primary);
            background: transparent;
            color: var(--gold-primary);
            font-family: var(--font-body);
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--gold-primary);
            color: var(--bg-dark);
            box-shadow: var(--gold-glow);
        }

        .btn-filled {
            background: linear-gradient(135deg, var(--gold-dim), var(--gold-primary));
            color: var(--bg-dark);
            border: none;
        }
        
        .btn-filled:hover {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-light));
            color: var(--bg-dark);
            box-shadow: var(--gold-glow);
        }

        .btn-danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover { background: var(--danger); color: rgb(156, 142, 142); box-shadow: 0 0 10px rgba(139,0,0,0.5); }

        /* --- LOGIN SCREEN --- */
        #login-view {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .brand-logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--gold-primary);
        }

        .role-selector {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-top: 30px;
        }

        .role-card {
            background: var(--bg-panel-lighter);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .role-card:hover, .role-card.active {
            border-color: var(--gold-primary);
            background: rgba(212, 175, 55, 0.05);
            transform: translateY(-3px);
        }

        .role-card i { font-size: 2.5rem; color: var(--gold-primary); }

        .role-card span {
            font-size: 1.2rem;
        }

        .login-form {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            animation: fadeIn 0.5s ease;
        }

        .input-group {
            position: relative;
            text-align: left;
        }
        
        .input-group label {
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-bottom: 5px;
            display: block;
        }

        .lux-input {
            width: 100%;
            padding: 12px;
            background: #000;
            border: 1px solid #333;
            color: #d1caca;
            font-family: var(--font-body);
            outline: none;
            transition: 0.3s;
        }

        .lux-input:focus {
            border-color: var(--gold-primary);
        }

        /* --- DASHBOARD LAYOUT --- */
        #dashboard-view {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-panel);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 5;
        }

        .sidebar-header {
            margin-bottom: 40px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.3s;
            border-left: 2px solid transparent;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(212, 175, 55, 0.05);
            color: var(--gold-primary);
            border-left-color: var(--gold-primary);
        }

        .user-profile {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--gold-dim);
            object-fit: cover;
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            background: var(--bg-dark);
            overflow-y: auto;
            position: relative;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .top-bar {
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(5px);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 4;
        }

        .page-content {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- CARDS & TABLES --- */
        .card {
            background: var(--bg-panel);
            border: 1px solid #333;
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--gold-dim);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-panel-lighter);
            padding: 20px;
            border: 1px solid #333;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-family: var(--font-heading);
            color: var(--gold-primary);
            margin: 10px 0;
        }

        /* Tables */
        .lux-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .lux-table th {
            text-align: left;
            padding: 15px;
            border-bottom: 2px solid var(--gold-dim);
            color: var(--gold-primary);
            font-family: var(--font-heading);
        }

        .lux-table td {
            padding: 15px;
            border-bottom: 1px solid #333;
            color: var(--text-muted);
        }

        .lux-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: #fff;
        }

        /* Status Badges */
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-pending { background: rgba(212, 175, 55, 0.2); color: var(--gold-primary); border: 1px solid var(--gold-dim); }
        .badge-accepted { background: rgba(27, 94, 32, 0.2); color: #4caf50; border: 1px solid #2e7d32; }
        .badge-rejected { background: rgba(139, 0, 0, 0.2); color: #ef5350; border: 1px solid #c62828; }

        /* --- TOAST NOTIFICATIONS --- */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-panel-lighter);
            color: #fff;
            padding: 15px 25px;
            border-left: 4px solid var(--gold-primary);
            box-shadow: var(--shadow);
            min-width: 300px;
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- MODAL --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }
        
        .modal-content {
            background: var(--bg-panel);
            border: 1px solid var(--gold-dim);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border-radius: 4px;
            position: relative;
            box-shadow: var(--shadow);
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 15px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.2rem;
        }
        .close-modal:hover { color: var(--danger); }

        /* --- RESPONSIVE --- */
        /* --- NOTIFICATION DROPDOWN --- */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--danger);
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            font-weight: bold;
            border: 2px solid var(--bg-dark);
        }

        .notification-header {
            padding: 15px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notification-list {
            overflow-y: auto;
            flex-grow: 1;
        }

        .notification-item {
            display: flex;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-item:hover {
            background: rgba(255,255,255,0.05);
        }

        .notification-item.unread {
            background: rgba(212, 175, 55, 0.05);
        }

        .notification-icon {
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }

        .notification-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .notification-footer {
            text-align: center;
            padding: 10px;
            border-top: 1px solid #444;
        }
        @media (max-width: 768px) {
            #dashboard-view { flex-direction: column; }
            .sidebar { width: 100%; height: auto; padding: 10px; flex-direction: row; justify-content: space-between; align-items: center; }
            .nav-menu { display: none; /* Simplified for mobile demo */ }
            .user-profile { border: none; padding: 0; }
            .user-details { display: none; }
            .main-content { margin-bottom: 60px; } /* Space for bottom nav if added */
        }

        /* --- AI WIDGET --- */
        #ai-widget-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1500;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #ai-toggle-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gold-primary);
            color: #000;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ai-toggle-btn:hover {
            transform: scale(1.1);
        }

        #ai-chat-window {
            width: 350px;
            height: 450px;
            background: var(--bg-panel);
            border: 1px solid var(--gold-dim);
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
        }

        .ai-header {
            background: var(--bg-panel-lighter);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            color: var(--gold-primary);
            font-weight: bold;
        }

        .ai-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ai-msg-bot {
            align-self: flex-start;
            background: var(--bg-panel-lighter);
            padding: 10px 15px;
            border-radius: 10px 10px 10px 0;
            max-width: 80%;
            font-size: 0.9rem;
            color: #fff;
        }

        .ai-msg-user {
            align-self: flex-end;
            background: var(--gold-dim);
            padding: 10px 15px;
            border-radius: 10px 10px 0 10px;
            max-width: 80%;
            font-size: 0.9rem;
            color: #fff;
        }

        .ai-input-area {
            padding: 15px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ai-input-area input {
            flex-grow: 1;
            background: var(--bg-dark);
            border: 1px solid #333;
            padding: 10px;
            border-radius: 20px;
            color: #fff;
            outline: none;
        }

        .ai-input-area i {
            color: var(--gold-primary);
            cursor: pointer;
            font-size: 1.2rem;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <!-- AI ASSISTANT WIDGET -->
    <div id="ai-widget-container">
        <div id="ai-chat-window" class="hidden">
            <div class="ai-header">
                <span><i class="fa-solid fa-robot"></i> LuxeAI Assistant</span>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="toggleAiChat()"></i>
            </div>
            <div id="ai-messages" class="ai-messages">
                <div class="ai-msg-bot">Hello! I am LuxeAI. How can I assist you today?</div>
            </div>
            <div class="ai-input-area">
                <input type="text" id="ai-user-input" placeholder="Ask me anything..." onkeypress="handleAiInput(event)">
                <i class="fa-solid fa-paper-plane" onclick="sendAiMessage()"></i>
            </div>
        </div>
        <button id="ai-toggle-btn" onclick="toggleAiChat()">
            <i class="fa-solid fa-robot"></i>
        </button>
    </div>

    <!-- APPLICATION MODAL -->
    <div id="application-modal" class="modal hidden">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-modal" onclick="closeModal()"></i>
            <h3 style="margin-bottom: 5px;">Apply for Position</h3>
            <p style="color: var(--gold-primary); margin-bottom: 20px;">
                <span id="modal-job-title">Job Title</span> at <span id="modal-company">Company</span>
            </p>
            
            <form id="application-form" onsubmit="submitApplication(event)">
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Full Name</label>
                    <input type="text" id="app-name" class="lux-input" readonly style="opacity: 0.7; cursor: not-allowed;">
                </div>
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Email Address</label>
                    <input type="email" id="app-email" class="lux-input" placeholder="your.email@example.com" required>
                </div>
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Cover Letter</label>
                    <textarea id="app-cover" class="lux-input" rows="4" placeholder="Why are you a good fit?" required></textarea>
                </div>
                <div class="input-group" style="margin-bottom: 20px;">
                    <label>Resume</label>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <input type="file" class="lux-input" style="padding: 8px;">
                    </div>
                    <p style="font-size: 0.7rem; color: var(--text-muted); margin-top: 5px;">Leave empty to use profile resume.</p>
                </div>
                
                <div class="flex gap-10">
                    <button type="button" class="btn btn-danger" style="flex: 1;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-filled" style="flex: 1;">Submit Application</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCHEDULE INTERVIEW MODAL -->
    <div id="schedule-modal" class="modal hidden">
        <div class="modal-content">
            <i class="fa-solid fa-xmark close-modal" onclick="closeScheduleModal()"></i>
            <h3 style="margin-bottom: 20px;">Schedule Interview</h3>
            <form onsubmit="event.preventDefault(); handleScheduleSubmit()">
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Candidate Name</label>
                    <input type="text" id="sched-name" class="lux-input" required placeholder="e.g. Alice Walker">
                </div>
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Position</label>
                    <input type="text" id="sched-pos" class="lux-input" required placeholder="e.g. Software Engineer">
                </div>
                <div class="flex gap-20" style="margin-bottom: 20px;">
                    <div class="input-group" style="flex: 1;">
                        <label>Date</label>
                        <input type="date" id="sched-date" class="lux-input" required>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <label>Time</label>
                        <input type="time" id="sched-time" class="lux-input" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-filled" style="width: 100%;">Confirm Schedule</button>
            </form>
        </div>
    </div>

    <!-- VIEW STUDENT PROFILE MODAL -->
    <div id="student-profile-modal" class="modal hidden">
        <div class="modal-content" style="max-width: 700px;">
            <i class="fa-solid fa-xmark close-modal" onclick="closeStudentProfileModal()"></i>
            <div id="student-profile-content">
                <!-- Profile content will be injected here -->
            </div>
        </div>
    </div>

    <!-- 1. LOGIN VIEW -->
    <section id="login-view">
        <div class="login-card">
            <h1 class="brand-logo">JOB MATCH</h1>
            <p style="color: var(--text-muted); font-style: italic;">Elite Career Management</p>
            
            <div class="role-selector">
                <div class="role-card" onclick="selectRole('student', this)">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>Student</span>
                </div>
                <div class="role-card" onclick="selectRole('admin', this)">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>Admin</span>
                </div>
                <div class="role-card" onclick="selectRole('company', this)">
                    <i class="fa-solid fa-building"></i>
                    <span>Company</span>
                </div>
            </div>

            <div id="login-form-container" class="login-form hidden">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="lux-input" placeholder="Enter ID">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" class="lux-input" placeholder="••••••••">
                </div>
                <button class="btn btn-filled" style="width: 100%;" onclick="handleLogin()">Enter System</button>
                <button class="btn" style="width: 100%; margin-top: 5px; border: none; font-size: 0.75rem;" onclick="resetLogin()">Back to Role Selection</button>
            </div>
        </div>
    </section>

    <!-- 2. DASHBOARD VIEW -->
    <section id="dashboard-view" class="hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2 style="font-size: 1.2rem; color: var(--gold-primary);">JOB MATCH</h2>
            </div>
            
            <nav class="nav-menu" id="sidebar-nav">
                <!-- Nav items injected by JS based on role -->
            </nav>

            <div class="user-profile">
                <img src="https://picsum.photos/seed/luxe/100/100" alt="User" class="avatar" onclick="goToProfile()" style="cursor: pointer;">
                <div class="user-details">
                    <h4 id="user-name-display" style="font-size: 0.9rem; color: #fff;">User Name</h4>
                    <span id="user-role-display" style="font-size: 0.75rem; color: var(--gold-primary); text-transform: uppercase;">Role</span>
                </div>
                <i class="fa-solid fa-right-from-bracket" style="margin-left: auto; cursor: pointer; color: var(--text-muted);" onclick="logout()"></i>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <h3 id="page-title">Dashboard</h3>
                <div style="display: flex; gap: 20px; align-items: center;">
                    <div class="notification-wrapper" style="position: relative;">
                        <i class="fa-regular fa-bell" style="color: var(--gold-primary); cursor: pointer; font-size: 1.1rem;" onclick="toggleNotifications()"></i>
                        <span id="notification-badge" class="notification-badge hidden"></span>
                        <div id="notification-panel" class="card hidden" style="position: absolute; top: 150%; right: 0; width: 380px; z-index: 100; padding: 0; max-height: 450px; display: flex; flex-direction: column;">
                            <!-- Notifications will be injected here -->
                        </div>
                    </div>
                    <i class="fa-regular fa-envelope" style="color: var(--gold-primary); cursor: pointer; font-size: 1.1rem;"></i>
                </div>
            </div>

            <div id="content-area" class="page-content">
                <!-- Dynamic Content Injected Here -->
            </div>
        </main>
    </section>

    <script>
        // --- DATA & STATE ---
        const API_URL = 'http://localhost:3000/api';

        const state = {
            currentUser: null,
            selectedRole: null,
            jobs: [],
            applications: [],
            studentProfile: {
                branch: "",
                year: "",
                cgpa: "",
                resume: null
            },
            reviews: [],
            offers: [],
            candidates: [],
            interviews: [],
            companies: [],
            notifications: []
        };
        
        // --- DB HELPERS ---
        async function fetchState() {
            try {
                const response = await fetch(`${API_URL}/state`);
                const data = await response.json();
                Object.keys(data).forEach(key => { if (key !== 'currentUser') state[key] = data[key]; });
            } catch (error) {
                console.error('DB fetch failed:', error);
                showToast("Database server offline. Using session memory.", "error");
            }
        }

        async function saveState() {
            try {
                await fetch(`${API_URL}/state`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
            } catch (error) {
                console.error('DB save failed:', error);
            }
        }

        // Close notification panel if clicked outside
        window.addEventListener('click', function(e) {
            const panel = document.getElementById('notification-panel');
            if (panel && !panel.contains(e.target) && !e.target.closest('.notification-wrapper')) {
                panel.classList.add('hidden');
            }
        });
        const interviewQuestions = {
            behavioral: [
                "Tell me about yourself.",
                "What are your biggest strengths and weaknesses?",
                "Describe a challenging situation you faced at work and how you handled it.",
                "Where do you see yourself in 5 years?",
                "Why are you interested in this role?",
                "Tell me about a time you worked successfully as part of a team.",
                "How do you handle pressure or stressful situations?"
            ],
            technical: [
                "Explain the difference between `let`, `const`, and `var` in JavaScript.",
                "What is the box model in CSS?",
                "Describe the concept of polymorphism in object-oriented programming.",
                "What is a RESTful API?",
                "Explain the difference between SQL and NoSQL databases.",
                "What is the purpose of a `finally` block in a try-catch statement?",
                "What are Promises in JavaScript and why are they useful?"
            ]
        };
        let currentQuestionIndex = 0;
        let currentInterviewType = '';
        let currentConversation = [];
        // --- AUTH FUNCTIONS ---
        
        function selectRole(role, element) {
            state.selectedRole = role;
            
            // UI Update
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            
            // Show form
            document.getElementById('login-form-container').classList.remove('hidden');
            document.getElementById('username').focus();
            
            // Set default username hint
            document.getElementById('username').value = role === 'admin' ? 'admin_officer' : (role === 'company' ? 'company_rep' : 'student_user');
        }

        function resetLogin() {
            state.selectedRole = null;
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('active'));
            document.getElementById('login-form-container').classList.add('hidden');
        }

        async function handleLogin() {
            const username = document.getElementById('username').value;
            if(!username) {
                showToast("Please enter a username", "error");
                return;
            }

            // Simulate Login
            state.currentUser = {
                name: username,
                role: state.selectedRole
            };

            // Connect to DB and pull latest data
            await fetchState();

            // Transition
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
            
            // Init Dashboard
            initDashboard();
            showToast(`Welcome back, ${state.currentUser.name}. Database connected.`, "success");
        }

        function logout() {
            state.currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            resetLogin();
            showToast("Logged out successfully", "info");
        }

        // --- DASHBOARD LOGIC ---

        function initDashboard() {
            const user = state.currentUser;
            
            // Set User Profile Info
            document.getElementById('user-name-display').innerText = user.name;
            document.getElementById('user-role-display').innerText = user.role;

            // Build Sidebar based on Role
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = ''; // Clear existing

            let menuItems = [];

            if (user.role === 'student') {
                menuItems = [
                    { id: 'dash', label: 'Overview', icon: 'fa-chart-pie' },
                    { id: 'jobs', label: 'Available Jobs', icon: 'fa-briefcase' },
                    { id: 'my-apps', label: 'My Applications', icon: 'fa-file-contract' },
                    { id: 'reviews', label: 'Company Reviews', icon: 'fa-star' },
                    { id: 'ai-matching', label: 'AI Job Matching', icon: 'fa-robot' },
                    { id: 'interview-prep', label: 'Interview Prep Hub', icon: 'fa-book-open' },
                    { id: 'resume-builder', label: 'Resume Builder', icon: 'fa-file-word' },
                    { id: 'offer-management', label: 'Offer Management', icon: 'fa-sack-dollar' },
                    { id: 'video-interviews', label: 'Video Interviews', icon: 'fa-video' }
                ];
            } else if (user.role === 'admin') {
                menuItems = [
                    { id: 'dash', label: 'Overview', icon: 'fa-chart-line' },
                    { id: 'post-job', label: 'Post New Job', icon: 'fa-plus-circle' },
                    { id: 'manage-apps', label: 'Manage Applications', icon: 'fa-users-gear' },
                    { id: 'companies', label: 'Registered Companies', icon: 'fa-building' },
                    { id: 'technologies', label: 'New Technologies', icon: 'fa-microchip' }
                ];
            } else if (user.role === 'company') {
                menuItems = [
                    { id: 'dash', label: 'Company Dashboard', icon: 'fa-building' },
                    { id: 'applicants', label: 'Applicants', icon: 'fa-user-plus' },
                    { id: 'smart-search', label: 'Smart Candidate Search', icon: 'fa-magnifying-glass' },
                    { id: 'company-scheduler', label: 'Interview Scheduler', icon: 'fa-calendar-days' },
                    { id: 'offer-generator', label: 'Offer Letter Generator', icon: 'fa-file-signature' }
                ];
            }

            menuItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `nav-item ${index === 0 ? 'active' : ''}`;
                div.id = `nav-item-${item.id}`;
                div.innerHTML = `<i class="fa-solid ${item.icon}"></i> <span>${item.label}</span>`;
                div.onclick = () => switchTab(item.id, div);
                nav.appendChild(div);
            });

            // Load first tab
            loadContent(menuItems[0].id);
            updateNotificationBadge();
        }

        function switchTab(tabId, navElement) {
            // Update Nav UI
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            navElement.classList.add('active');

            loadContent(tabId);
        }

        function goToProfile() {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            loadContent('profile');
        }

        function loadContent(tabId) {
            const contentArea = document.getElementById('content-area');
            const pageTitle = document.getElementById('page-title');
            contentArea.innerHTML = ''; // Clear current content
            contentArea.style.opacity = 0; // For fade effect

            setTimeout(() => {
                contentArea.style.transition = 'opacity 0.4s ease';
                contentArea.style.opacity = 1;

                if (tabId === 'dash') renderDashboardHome(contentArea, pageTitle);
                else if (tabId === 'profile') renderStudentProfile(contentArea, pageTitle);
                else if (tabId === 'jobs') renderJobsList(contentArea, pageTitle);
                else if (tabId === 'my-apps') renderMyApplications(contentArea, pageTitle);
                else if (tabId === 'post-job') renderPostJob(contentArea, pageTitle);
                else if (tabId === 'manage-apps') renderAdminApps(contentArea, pageTitle);
                else if (tabId === 'applicants') renderCompanyApplicants(contentArea, pageTitle);
                else if (tabId === 'companies') renderCompanies(contentArea, pageTitle);
                else if (tabId === 'technologies') renderTechnologies(contentArea, pageTitle);
                else if (tabId === 'reviews') renderCompanyReviews(contentArea, pageTitle);
                else if (tabId === 'ai-matching') renderAiMatching(contentArea, pageTitle);
                else if (tabId === 'interview-prep') renderInterviewPrep(contentArea, pageTitle);
                else if (tabId === 'resume-builder') renderResumeBuilder(contentArea, pageTitle);
                else if (tabId === 'offer-management') renderOfferManagement(contentArea, pageTitle);
                else if (tabId === 'video-interviews') renderVideoInterview(contentArea, pageTitle);
                else if (tabId === 'smart-search') renderSmartSearch(contentArea, pageTitle);
                else if (tabId === 'company-scheduler') renderCompanyInterviewScheduler(contentArea, pageTitle);
                else if (tabId === 'offer-generator') renderOfferGenerator(contentArea, pageTitle);

            }, 50);
        }

        // --- RENDER FUNCTIONS (VIEWS) ---

        // 1. Generic Dashboard Overview
        function renderDashboardHome(container, title) {
            title.innerText = "Dashboard Overview";
            
            let statsHTML = '';
            const role = state.currentUser.role;

            if (role === 'student') {
                statsHTML = `
                    <div class="stat-card">
                        <div class="stat-number">3</div>
                        <p>Jobs Applied</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">1</div>
                        <p>Interviews Scheduled</p>
                    </div>
                `;
            } else if (role === 'admin') {
                statsHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${state.jobs.length}</div>
                        <p>Active Listings</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${state.applications.length}</div>
                        <p>Total Applications</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${state.companies.length}</div>
                        <p>Companies</p>
                    </div>
                `;
            } else if (role === 'company') {
                statsHTML = `
                    <div class="stat-card">
                        <div class="stat-number">2</div>
                        <p>Active Jobs</p>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">14</div>
                        <p>Resumes Received</p>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="stats-grid">${statsHTML}</div>
                <div class="card">
                    <h3><i class="fa-solid fa-circle-info" style="margin-right:10px;"></i> About JOB MATCH</h3>
                    <p style="color:var(--text-muted); margin-top:10px; line-height:1.6;">
                        JOB MATCH is the premier career management system designed to bridge the gap between elite talent and top-tier organizations. 
                        Our platform leverages AI-driven matching, seamless interview scheduling, and comprehensive profile management to ensure the perfect fit for every role.
                    </p>
                </div>
                <div class="card">
                    <h3><i class="fa-solid fa-newspaper" style="margin-right:10px;"></i> Recent Activity</h3>
                    <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px;">
                        <div style="padding: 15px; background: var(--bg-panel-lighter); border-radius: 4px; border-left: 3px solid var(--gold-primary);">
                            <h5 style="color: #fff; margin-bottom: 5px;">New Job Posted</h5>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">TechNova is hiring for "Senior Developer". Apply now!</p>
                            <span style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 5px;">2 hours ago</span>
                        </div>
                        <div style="padding: 15px; background: var(--bg-panel-lighter); border-radius: 4px; border-left: 3px solid var(--info);">
                            <h5 style="color: #fff; margin-bottom: 5px;">System Update</h5>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">Platform maintenance scheduled for this Sunday at 2:00 AM.</p>
                            <span style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 5px;">Yesterday</span>
                        </div>
                        <div style="padding: 15px; background: var(--bg-panel-lighter); border-radius: 4px; border-left: 3px solid var(--success);">
                            <h5 style="color: #fff; margin-bottom: 5px;">Placement Drive</h5>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">Goldman Sachs campus drive results are out. Check your email.</p>
                            <span style="font-size: 0.7rem; color: var(--text-muted); display: block; margin-top: 5px;">2 days ago</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. Student: Profile
        function renderStudentProfile(container, title) {
            title.innerText = "My Student Profile";
            const p = state.studentProfile;
            
            container.innerHTML = `
                <div class="card" style="max-width: 800px; margin: 0 auto;">
                    <form onsubmit="event.preventDefault(); handleProfileUpdate();">
                        <h4 style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;">Academic Details</h4>
                        
                        <div class="flex gap-20" style="margin-bottom:20px;">
                            <div class="input-group" style="flex:1;">
                                <label>Branch / Major</label>
                                <input type="text" id="profBranch" class="lux-input" value="${p.branch}" placeholder="e.g. Computer Science">
                            </div>
                            <div class="input-group" style="flex:1;">
                                <label>Current Year</label>
                                <select id="profYear" class="lux-input">
                                    <option value="" disabled ${!p.year ? 'selected' : ''}>Select Year</option>
                                    <option value="1" ${p.year === '1' ? 'selected' : ''}>1st Year</option>
                                    <option value="2" ${p.year === '2' ? 'selected' : ''}>2nd Year</option>
                                    <option value="3" ${p.year === '3' ? 'selected' : ''}>3rd Year</option>
                                    <option value="4" ${p.year === '4' ? 'selected' : ''}>4th Year</option>
                                </select>
                            </div>
                        </div>

                        <div class="input-group" style="margin-bottom:20px;">
                            <label>CGPA (Cumulative)</label>
                            <input type="number" step="0.01" min="0" max="10" id="profCGPA" class="lux-input" value="${p.cgpa}" placeholder="e.g. 8.5">
                        </div>

                        <h4 style="margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 30px;">Documents</h4>
                        
                        <div class="input-group" style="margin-bottom:20px;">
                            <label>Resume (PDF)</label>
                            <div style="display:flex; align-items:center; gap:10px;">
                                <input type="file" id="profResume" class="lux-input" accept="application/pdf" style="padding: 8px;">
                                ${p.resume ? `<span style="color:var(--success); font-size:0.8rem;"><i class="fa-solid fa-check"></i> ${p.resume} uploaded</span>` : ''}
                            </div>
                            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:5px;">Max file size: 5MB. PDF only.</p>
                        </div>

                        <button type="submit" class="btn btn-filled" style="width:100%;">Save Profile</button>
                    </form>
                </div>
            `;
        }

        // 3. Student: Jobs List
        function renderJobsList(container, title) {
            title.innerText = "Available Opportunities";
            
            let jobsHTML = state.jobs.map(job => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;">
                    <div>
                        <h3 style="color:#fff;">${job.title}</h3>
                        <p style="color:var(--gold-primary); margin-bottom:5px;">${job.company}</p>
                        <div style="display:flex; gap:15px; font-size:0.85rem; color:var(--text-muted);">
                            <span><i class="fa-solid fa-money-bill"></i> ${job.salary}</span>
                            <span><i class="fa-solid fa-clock"></i> ${job.type}</span>
                            <span><i class="fa-regular fa-calendar"></i> ${job.posted}</span>
                        </div>
                    </div>
                    <button class="btn btn-filled" onclick="openApplicationModal(${job.id})">Apply Now</button>
                </div>
            `).join('');

            container.innerHTML = jobsHTML;
        }

        // 3. Student: My Applications
        function renderMyApplications(container, title) {
            title.innerText = "My Application Status";
            
            // Filter mock data for current student (simulation)
            const myApps = state.applications; // showing all for demo purposes

            let rows = myApps.map(app => {
                const job = state.jobs.find(j => j.id === app.jobId) || { company: 'Unknown', title: 'Unknown' };
                let badgeClass = app.status === 'Pending' ? 'badge-pending' : (app.status === 'Accepted' ? 'badge-accepted' : 'badge-rejected');
                
                return `
                <tr>
                    <td>${job.title}</td>
                    <td>${job.company}</td>
                    <td>${app.date}</td>
                    <td><span class="badge ${badgeClass}">${app.status}</span></td>
                    <td><button class="btn" style="padding:5px 10px; font-size:0.7rem;" onclick="viewApplication(${app.id})">View</button></td>
                </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="card">
                    <table class="lux-table">
                        <thead>
                            <tr>
                                <th>Position</th>
                                <th>Company</th>
                                <th>Applied Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>${rows.length ? rows : '<tr><td colspan="5" style="text-align:center;">No applications found</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        // 4. Admin/Company: Post Job
        function renderPostJob(container, title) {
            title.innerText = "Post New Position";
            
            container.innerHTML = `
                <div class="card" style="max-width: 800px; margin: 0 auto;">
                    <form id="post-job-form" onsubmit="event.preventDefault(); handlePostJob();">
                        <div class="input-group" style="margin-bottom:20px;">
                            <label>Job Title</label>
                            <input type="text" id="jobTitle" class="lux-input" placeholder="e.g. Senior Developer">
                        </div>
                        <div class="flex gap-20" style="margin-bottom:20px;">
                            <div class="input-group" style="flex:1;">
                                <label>Company Name</label>
                                <input type="text" id="jobCompany" class="lux-input" placeholder="e.g. TechNova">
                            </div>
                            <div class="input-group" style="flex:1;">
                                <label>Salary Range</label>
                                <input type="text" id="jobSalary" class="lux-input" placeholder="e.g. $90k - $120k">
                            </div>
                        </div>
                        <div class="input-group" style="margin-bottom:20px;">
                            <label>Job Type</label>
                            <select id="jobType" class="lux-input">
                                <option>Full-time</option>
                                <option>Part-time</option>
                                <option>Internship</option>
                                <option>Contract</option>
                            </select>
                        </div>
                        <div class="input-group" style="margin-bottom:20px;">
                            <label>Description</label>
                            <textarea id="jobDesc" class="lux-input" rows="4" placeholder="Job description..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-filled" style="width:100%;">Publish Position</button>
                    </form>
                </div>
            `;
        }

        // 5. Admin: Manage Applications
        function renderAdminApps(container, title) {
            title.innerText = "All Student Applications";

            let rows = state.applications.map(app => {
                const job = state.jobs.find(j => j.id === app.jobId) || { title: 'Unknown' };
                return `
                <tr>
                    <td>${app.studentName}</td>
                    <td>${job.title}</td>
                    <td><span class="badge badge-pending">${app.status}</span></td>
                    <td>
                        <button class="btn btn-filled" style="padding:5px 10px; font-size:0.7rem; margin-right:5px;" onclick="updateAppStatus(${app.id}, 'Accepted')"><i class="fa-solid fa-check"></i></button>
                        <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem;" onclick="updateAppStatus(${app.id}, 'Rejected')"><i class="fa-solid fa-xmark"></i></button>
                    </td>
                </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="card">
                    <table class="lux-table">
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Job Applied</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        // 7. Company: Applicants
        function renderCompanyApplicants(container, title) {
            title.innerText = "Recent Applicants";
            
            // Simulate filtering for the logged-in company (assuming TechNova for demo)
            const companyName = "TechNova"; 
            const companyJobs = state.jobs.filter(j => j.company === companyName).map(j => j.id);
            const companyApps = state.applications.filter(a => companyJobs.includes(a.jobId));
            let rows = companyApps.map(app => {
                const job = state.jobs.find(j => j.id === app.jobId) || { title: 'Unknown' };
                const candidate = state.candidates.find(c => c.name === app.studentName);
                const candidateId = candidate ? candidate.id : null;

                return `
                <tr>
                    <td>${candidateId ? `<a href="#" onclick="event.preventDefault(); openStudentProfileModal(${candidateId})" style="color: var(--gold-light); text-decoration: underline;">${app.studentName}</a>` : app.studentName}</td>
                    <td>${job.title}</td>
                    <td><span class="badge badge-pending">${app.status}</span></td>
                    <td>
                        ${candidateId ? `<button class="btn" style="padding:5px 10px; font-size:0.7rem; margin-right:5px;" onclick="openStudentProfileModal(${candidateId})">View Profile</button>` : ''}
                        <button class="btn btn-filled" style="padding:5px 10px; font-size:0.7rem; margin-right:5px;" onclick="updateAppStatus(${app.id}, 'Accepted')">Accept</button>
                        <button class="btn btn-danger" style="padding:5px 10px; font-size:0.7rem;" onclick="updateAppStatus(${app.id}, 'Rejected')">Reject</button>
                    </td>
                </tr>`;
            }).join('');

            container.innerHTML = `
                <div class="card">
                    <table class="lux-table">
                        <thead>
                            <tr>
                                <th>Candidate</th>
                                <th>Position</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>${rows.length ? rows : '<tr><td colspan="4" style="text-align:center;">No applicants found for your jobs.</td></tr>'}</tbody>
                    </table>
                </div>
            `;
        }

        // 8. Admin: Companies
        function renderCompanies(container, title) {
            title.innerText = "Partner Companies";
            
            let rows = state.companies.map(comp => {
                let badge = comp.status === 'Verified' ? 'badge-accepted' : (comp.status === 'Pending' ? 'badge-pending' : 'badge-rejected');
                return `
                    <tr>
                        <td>${comp.name}</td>
                        <td>${comp.industry}</td>
                        <td>${comp.jobs}</td>
                        <td><span class="badge ${badge}">${comp.status}</span></td>

        function testCamera() {
            const video = document.getElementById('user-video-feed');
            const placeholder = document.getElementById('video-placeholder');
            const controls = document.getElementById('video-controls');

            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                showToast('Requesting camera access...', 'info');
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function (stream) {
                        video.srcObject = stream;
                        video.style.display = 'block';
                        placeholder.style.display = 'none';
                        controls.classList.remove('hidden');
                        controls.style.display = 'flex';
                        showToast('Camera active', 'success');
                    })
                    .catch(function (error) {
                        showToast('Camera access denied or error: ' + error.message, 'error');
                    });
            } else {
                showToast('Media devices not supported in this browser', 'error');
            }
        }

        function stopCamera() {
            const video = document.getElementById('user-video-feed');
            const placeholder = document.getElementById('video-placeholder');
            const controls = document.getElementById('video-controls');
            
            if (video.srcObject) {
                const tracks = video.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
            }
            
            video.style.display = 'none';
            placeholder.style.display = 'block';
            controls.classList.add('hidden');
            controls.style.display = 'none';
        }

                        <button class="btn" onclick="toggleVideo(this)" style="border-radius: 50%; width: 50px; height: 50px;"><i class="fa-solid fa-video"></i></button>
                        <button class="btn btn-danger" style="border-radius: 50%; width: 50px; height: 50px;" onclick="endVideoCall()"><i class="fa-solid fa-phone-slash"></i></button>
                    </div>
                </div>
                <style>
                    @keyframes wave {
                        0%, 100% { height: 10px; }
                        50% { height: 30px; }
                    }
                </style>
             `;
             
             // Initialize Speech Recognition if available
             if (SpeechRecognition) {
                speechRecognitionController = new SpeechRecognition();
                speechRecognitionController.continuous = false; // Listen for a single utterance
                speechRecognitionController.lang = 'en-US';
                speechRecognitionController.interimResults = false;
                speechRecognitionController.maxAlternatives = 1;
             }

             // Start camera for the call
             if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then(function (stream) {
                        currentInterviewStream = stream;
                        const video = document.getElementById('user-pip-video');
                        if(video) video.srcObject = stream;
                        
                        // Start Interview Sequence
                        setTimeout(startInterviewBot, 2000);
                    })
                    .catch(err => {
                        console.error(err);
                        showToast("Camera access required for interview.", "error");
                        // Attempt to run bot anyway for demo
                        setTimeout(startInterviewBot, 1000);
                    });
            }
        }

        function endVideoCall() {
            // Stop TTS
            if (speechSynthController) {
                speechSynthController.cancel();
            }
            
            // Stop Camera
            if (currentInterviewStream) {
                currentInterviewStream.getTracks().forEach(track => track.stop());
                currentInterviewStream = null;
            }

            // Return to menu
            loadContent('video-interviews');
        }

        function startInterviewBot() {
            const statusEl = document.getElementById('interviewer-status');
            const avatarEl = document.getElementById('interviewer-avatar');
            
            if(!statusEl) return;

            // Update Status
            statusEl.innerHTML = '<i class="fa-solid fa-microphone"></i> Voice Active';
            statusEl.style.color = 'var(--success)';
            if(avatarEl) avatarEl.style.borderColor = 'var(--success)';

            // Welcome Message
            speakText("Hello! I am the hiring manager. I cannot turn on my camera today, but I am excited to speak with you. Let's start with a few questions.");
            
            // Start Question Loop
            setTimeout(() => askNextQuestion(0), 9000);
        }

        function askNextQuestion(index) {
             const questions = [
                 "Tell me about yourself.",
                 "What are your greatest strengths?",
                 "Why do you want to work for this company?",
                 "Describe a difficult challenge you overcame.",
                 "Do you have any questions for us?"
             ];

             if (index >= questions.length) {
                 speakText("Thank you for your time. We will be in touch shortly. Goodbye!");
                 setTimeout(endVideoCall, 5000);
                 return;
             }

             const q = questions[index];
             
             // Show Subtitle
             const subEl = document.getElementById('question-display');
             if(subEl) {
                 subEl.innerText = q;
                 subEl.style.display = 'block';
             }

             // Speak
             speakText(q, () => {
                 // After speaking, wait for "User Answer" (Simulated delay)
                 const statusEl = document.getElementById('interviewer-status');
                 if(statusEl) {
                    statusEl.innerHTML = '<i class="fa-solid fa-ear-listen"></i> Listening...';
                    statusEl.style.color = 'var(--gold-primary)';
                    const av = document.getElementById('interviewer-avatar');
                    if(av) av.style.borderColor = 'var(--gold-primary)';
                 }
                 
                 setTimeout(() => { if(subEl) subEl.style.display = 'none'; }, 3000);

                 // NEW: Replace fixed timeout with speech recognition
                 const proceed = () => {
                     // Stop any lingering recognition
                    if (speechRecognitionController && isRecognizing) {
                        speechRecognitionController.stop();
                        isRecognizing = false;
                    }
                     const statusEl = document.getElementById('interviewer-status');
                     if(statusEl) {
                        statusEl.innerHTML = '<i class="fa-solid fa-microphone"></i> Voice Active';
                        statusEl.style.color = 'var(--success)';
                        const av = document.getElementById('interviewer-avatar');
                        if(av) av.style.borderColor = 'var(--success)';
                     }
                     askNextQuestion(index + 1);
                 };

                 if (speechRecognitionController && !isRecognizing) {
                    isRecognizing = true;
                    speechRecognitionController.start();

                    speechRecognitionController.onspeechstart = function() {
                        const pip = document.getElementById('user-pip-video');
                        if (pip) pip.parentElement.style.borderColor = 'var(--gold-primary)';
                    };

                    speechRecognitionController.onresult = function(event) {
                        console.log('User answer detected:', event.results[0][0].transcript);
                        showToast('Thank you for your answer.', 'info');
                    };

                    speechRecognitionController.onend = function() {
                        isRecognizing = false;
                        const pip = document.getElementById('user-pip-video');
                        if (pip) pip.parentElement.style.borderColor = '#444';
                        setTimeout(proceed, 1000); // Move to next question after a short pause
                    };

                    speechRecognitionController.onerror = function(event) {
                        if (event.error === 'no-speech') showToast("I didn't hear an answer, let's move on.", 'info');
                    };
                 } else {
                    setTimeout(proceed, 8000); // Fallback for browsers without SpeechRecognition
                 }
             });
        }

        function speakText(text, callback) {
            if (!speechSynthController) return;
            
            speechSynthController.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            // utterance.voice = ... (optional: select a specific voice)
            
            const waveEl = document.getElementById('voice-wave');
            if(waveEl) waveEl.classList.remove('hidden');

            utterance.onend = function() {
                if(waveEl) waveEl.classList.add('hidden');
                if (callback) callback();
            };

            speechSynthController.speak(utterance);
        }

        function toggleMute(btn) {
            if(currentInterviewStream) {
                const audioTrack = currentInterviewStream.getAudioTracks()[0];
                if(audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    btn.innerHTML = audioTrack.enabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
                    btn.classList.toggle('btn-danger', !audioTrack.enabled);
                }
            }
        }

        function toggleVideo(btn) {
            if(currentInterviewStream) {
                const videoTrack = currentInterviewStream.getVideoTracks()[0];
                if(videoTrack) {
                    videoTrack.enabled = !videoTrack.enabled;
                    btn.innerHTML = videoTrack.enabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';

                }
            }
        }

            letterContainer.style.fontFamily = 'Times, serif';
            letterContainer.style.fontSize = '12pt';
            letterContainer.style.position = 'absolute';
            letterContainer.style.left = '-9999px'; // Hide it off-screen
            letterContainer.style.lineHeight = '1.5';
            letterContainer.style.boxSizing = 'border-box';

            // 2. Populate with HTML content
            letterContainer.innerHTML = `

        function addDynamicListItem(type) {
            const input = document.getElementById(`resume-${type}-input`);
            const container = document.getElementById(`resume-${type}-tags`);
            const value = input.value.trim();

            if (value && container) {
                const tag = document.createElement('span');
                tag.className = 'dynamic-tag';
                tag.innerText = value;
                
                const removeBtn = document.createElement('i');
                removeBtn.className = 'fa-solid fa-xmark';
                removeBtn.style.marginLeft = '8px';
                removeBtn.style.cursor = 'pointer';
                removeBtn.onclick = () => {
                    tag.remove();
                    previewResume(); // Update preview on removal
                };
                
                tag.appendChild(removeBtn);
                container.appendChild(tag);
                input.value = '';
                previewResume(); // Update preview on addition
            }
        }

        function addResumeSection(type) {

            const group = container.querySelector('.resume-group');
            if(!group) return; // Should not happen
            
            const newGroup = group.cloneNode(true);
            
            // Clear input values in the cloned group
            newGroup.querySelectorAll('input, textarea').forEach(input => input.value = '');
            
            container.appendChild(newGroup);
            showToast(`Added new ${type} section`, 'info');
        }

        function downloadResumeAsPDF() {
            const { jsPDF } = window.jspdf;
            const resume = document.getElementById('resume-preview-container');
            const name = document.getElementById('resume-name').value || 'resume';

            if (!name) {
                showToast('Please fill in your name before downloading.', 'error');
                return;
            }

            showToast('Generating PDF...', 'info');

            html2canvas(resume, {
                scale: 2, // Higher scale for better quality
                useCORS: true,
                backgroundColor: null // Use element's background
            }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
                pdf.save(`${name.replace(/ /g, '_')}_Resume.pdf`);
                showToast('PDF downloaded successfully!', 'success');
            }).catch(err => {
                showToast('Failed to generate PDF. See console for details.', 'error');
                console.error(err);
            });
        }

        function submitMockAnswer() {
            const input = document.getElementById('mock-input');
            const area = document.getElementById('mock-chat-area');
            const text = input.value.trim();
            if(!text) return;

            currentConversation.push({ sender: 'user', text: text });

            // User msg
            const userDiv = document.createElement('div');
            userDiv.className = 'ai-msg-user';
            userDiv.innerText = text;
            userDiv.style.marginTop = '10px';
            area.appendChild(userDiv);
            
            input.value = '';
            area.scrollTop = area.scrollHeight;

            // Bot response simulation
            setTimeout(() => {
                currentQuestionIndex++;
                const questions = interviewQuestions[currentInterviewType];
                let nextQuestion;

                if (currentQuestionIndex < questions.length) {
                    nextQuestion = questions[currentQuestionIndex];
                } else {
                    nextQuestion = "That was the last question. Thank you for your time! Click the button below to get AI feedback on your performance.";
                    input.disabled = true;
                    const sendButton = document.querySelector('#mock-chat-area + .flex .btn-filled');
                    if(sendButton) sendButton.disabled = true;

                    // Add a feedback button
                    const feedbackBtn = document.createElement('button');
                    feedbackBtn.className = 'btn btn-filled';
                    feedbackBtn.innerText = 'Get AI Feedback';
                    feedbackBtn.style.marginTop = '15px';
                    feedbackBtn.style.width = '100%';
                    feedbackBtn.onclick = generateInterviewFeedback;
                    document.querySelector('.card:has(#mock-chat-area)').appendChild(feedbackBtn);
                }

                const botDiv = document.createElement('div');
                botDiv.className = 'ai-msg-bot';
                botDiv.innerText = nextQuestion;
                botDiv.style.marginTop = '10px';
                area.appendChild(botDiv);
                area.scrollTop = area.scrollHeight;

                currentConversation.push({ sender: 'bot', text: nextQuestion });
            }, 1000);
        }

        function generateInterviewFeedback() {
            const contentArea = document.getElementById('content-area');
            const pageTitle = document.getElementById('page-title');
            pageTitle.innerText = "Interview Performance Review";

            showToast("AI is analyzing your answers...", "info");

            // Simulate analysis
            setTimeout(() => {
                const userAnswers = currentConversation.filter(m => m.sender === 'user');
                const averageLength = userAnswers.reduce((acc, ans) => acc + ans.text.split(' ').length, 0) / userAnswers.length;

                let feedbackPoints = [];

                if (averageLength < 20) {
                    feedbackPoints.push({ title: "Answer Detail", rating: "Needs Improvement", comment: "Your answers were a bit brief. Try to elaborate more using the STAR method (Situation, Task, Action, Result)." });
                } else if (averageLength > 150) {
                    feedbackPoints.push({ title: "Coniseness", rating: "Needs Improvement", comment: "Your answers were quite long. Try to be more concise to keep the interviewer engaged." });
                } else {
                    feedbackPoints.push({ title: "Answer Length", rating: "Good", comment: "Your answers were of a good length, providing sufficient detail without being verbose." });
                }

                const confidenceKeywords = ['led', 'managed', 'achieved', 'improved', 'created'];
                let confidenceScore = userAnswers.filter(ans => confidenceKeywords.some(kw => ans.text.toLowerCase().includes(kw))).length;

                if (confidenceScore / userAnswers.length >= 0.4) {
                    feedbackPoints.push({ title: "Confident Language", rating: "Excellent", comment: "You used strong, confident action verbs to describe your experiences. This is very effective." });
                } else {
                    feedbackPoints.push({ title: "Language Use", rating: "Good", comment: "Consider using more powerful action verbs to describe your accomplishments." });
                }

                const fillerWords = ['um', 'uh', 'like', 'you know'];
                let fillerCount = 0;
                userAnswers.forEach(ans => { fillerWords.forEach(fw => { fillerCount += (ans.text.toLowerCase().match(new RegExp(`\\b${fw}\\b`, 'g')) || []).length; }); });

                if (fillerCount > 2) {
                    feedbackPoints.push({ title: "Filler Words", rating: "Needs Improvement", comment: `We detected potential use of filler words. Practice pausing to think instead of using fillers.` });
                } else {
                    feedbackPoints.push({ title: "Clarity", rating: "Excellent", comment: "Your responses were clear and articulate, with minimal use of filler words. Great job!" });
                }

                let feedbackHTML = feedbackPoints.map(fb => `
                    <div class="stat-card" style="text-align: left;">
                        <div class="flex justify-between items-center">
                            <h4 style="color: #fff;">${fb.title}</h4>
                            <span class="badge ${fb.rating === 'Excellent' || fb.rating === 'Good' ? 'badge-accepted' : 'badge-rejected'}">${fb.rating}</span>
                        </div>
                        <p style="margin: 10px 0; color: var(--text-muted);">${fb.comment}</p>
                    </div>
                `).join('');

                contentArea.innerHTML = `
                    <button class="btn" style="margin-bottom: 20px;" onclick="renderMockInterviews()"><i class="fa-solid fa-arrow-left"></i> Back to Mock Interviews</button>
                    <div class="card"><h3><i class="fa-solid fa-magnifying-glass-chart" style="margin-right:10px;"></i>Your AI Feedback Report</h3></div>
                    <div class="stats-grid">${feedbackHTML}</div>
                    <div class="card"><h4>Your Full Transcript</h4><div id="transcript-area" style="margin-top: 15px; max-height: 300px; overflow-y: auto; background: var(--bg-panel-lighter); padding: 15px; border-radius: 4px;">
                        ${currentConversation.map(msg => `<div class="ai-msg-${msg.sender}" style="margin-top: 5px;">${msg.text}</div>`).join('')}
                    </div></div>`;
            }, 2000);
        }

        function startCodingChallenge(title) {
            const contentArea = document.getElementById('content-area');
            const pageTitle = document.getElementById('page-title');
            pageTitle.innerText = `Challenge: ${title}`;

            contentArea.innerHTML = `

                <div class="flex gap-20" style="height: 70vh;">
